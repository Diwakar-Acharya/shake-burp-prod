{% extends "base.html" %}

{% block title %}Payment Cancelled — Shake &amp; Burp{% endblock %}

{% block content %}
<div class="ctn" style="padding:120px 24px 80px; text-align:center; max-width:600px; margin:0 auto;">
  <div style="width:80px; height:80px; border-radius:50%; background:rgba(209,0,0,0.1); border:1px solid rgba(209,0,0,0.3); display:inline-flex; align-items:center; justify-content:center; margin-bottom:24px;">
    <svg style="width:40px; height:40px; stroke:var(--red); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="15" y1="9" x2="9" y2="15"></line>
      <line x1="9" y1="9" x2="15" y2="15"></line>
    </svg>
  </div>
  <h1 style="font-family:var(--ff-d); font-size:36px; font-weight:700; color:var(--white); margin-bottom:16px;">Payment Cancelled</h1>
  <p style="color:var(--steel); font-size:15px; line-height:1.6; margin-bottom:32px;">
    Your payment process was cancelled. No charges were made to your account.
  </p>
  <a href="{% url 'cart' %}" style="display:inline-block; padding:14px 32px; background:var(--card); border:1px solid var(--border); color:var(--white); font-family:var(--ff-m); font-weight:700; border-radius:10px;">Return to Cart</a>
</div>
{% endblock %}
